# ROUTLAW Apache vhost (build-plan §3 T1.4 / SEC-007 / ASVS L2).
#
# Deployment: this is the SOURCE OF TRUTH for the ROUTLAW vhost. The active
# Apache instance reads C:/xampp/apache/conf/extra/httpd-vhosts.conf — copy the
# <VirtualHost *:8080> block below into that file (it is already present after
# the 2026-08-21 setup). This file is committed so the deployment is reproducible
# and reviewable, not a buried hand-edit to a system config.
#
# Requirements on the base httpd.conf:
#   Listen 80
#   Listen 8080                # added 2026-08-21 for this vhost
#   LoadModule rewrite_module  # already loaded in XAMPP
#   LoadModule headers_module  # already loaded in XAMPP
#   Include conf/extra/httpd-vhosts.conf   # already present in XAMPP
#
# Verify after a panel restart:
#   curl -sI http://127.0.0.1:8080/  -> 200 + Content-Security-Policy (1, no -Report-Only)
#   curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/src/Security/Headers.php -> 404

<VirtualHost *:8080>
    ServerName routlaw.local
    DocumentRoot "C:/xampp/htdocs/Routlaw/public"
    <Directory "C:/xampp/htdocs/Routlaw/public">
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    # Private dirs are outside docroot; this is belt-and-suspenders if the
    # vhost is ever repointed at the parent folder.
    <DirectoryMatch "C:/xampp/htdocs/Routlaw/(config|src|migrations|storage|vendor|scripts)">
        Require all denied
    </DirectoryMatch>
    ErrorLog "logs/routlaw-error.log"
    CustomLog "logs/routlaw-access.log" common
</VirtualHost>
